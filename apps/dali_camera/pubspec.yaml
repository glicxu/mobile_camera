name: dali_camera
description: Shared Dali camera application for Android and iOS.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  dali_camera_core:
    path: ../../packages/dali_camera_core
  dali_camera_platform:
    path: ../../packages/dali_camera_platform
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/catalog/
    - assets/branding/
