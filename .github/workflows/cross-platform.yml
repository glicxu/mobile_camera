name: Cross-platform
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/cross-platform-*']
  pull_request:
permissions:
  contents: read
jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true
      - run: pip install Pillow==11.3.0
      - run: python tools/export_shared_catalog.py --check
      - run: dart pub get && dart analyze && dart test
        working-directory: packages/dali_camera_core
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: apps/dali_camera
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true
      - run: flutter build apk --debug
        working-directory: apps/dali_camera
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/dali_camera/build/app/outputs/flutter-apk/app-debug.apk
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pin Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true
      - name: Export native coaching fixtures
        run: |
          swiftc -parse-as-library DaliCamera/Models.swift DaliCamera/CoachingEngine.swift tools/ExportCrossPlatformFixtures.swift -o /tmp/export-dali-fixtures
          /tmp/export-dali-fixtures "$GITHUB_WORKSPACE/fixtures/swift-baseline.json"
          cd packages/dali_camera_core
          dart pub get
          dart run tool/verify_swift_fixtures.dart ../../fixtures/swift-baseline.json
      - uses: actions/upload-artifact@v4
        with:
          name: swift-baseline-fixtures
          path: fixtures/swift-baseline.json
      - run: flutter build ios --debug --no-codesign
        working-directory: apps/dali_camera
      - name: Boot iPhone simulator
        timeout-minutes: 5
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if v["name"].startswith("iPhone")))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Preserve native iOS unit validation
        timeout-minutes: 10
        run: xcodebuild test -project DaliCamera.xcodeproj -scheme DaliCamera -only-testing:DaliCameraTests -destination "platform=iOS Simulator,id=$DEVICE_ID" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Native Flutter bridge on iPhone simulator
        timeout-minutes: 10
        run: flutter test integration_test/bridge_test.dart -d "$DEVICE_ID"
        working-directory: apps/dali_camera
