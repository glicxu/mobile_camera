name: Cross-platform
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/cross-platform-*']
  pull_request:
permissions:
  contents: read
jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true
      - run: pip install Pillow==11.3.0
      - run: python tools/export_shared_catalog.py --check
      - run: dart pub get && dart analyze && dart test
        working-directory: packages/dali_camera_core
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: apps/dali_camera
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true
      - run: flutter build apk --debug
        working-directory: apps/dali_camera
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/dali_camera/build/app/outputs/flutter-apk/app-debug.apk
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true
      - run: flutter build ios --debug --no-codesign
        working-directory: apps/dali_camera
