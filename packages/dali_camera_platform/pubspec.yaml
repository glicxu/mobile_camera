name: dali_camera_platform
description: Dali camera, analysis, storage and speech services for Android and iOS.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.12.2
  flutter: '>=3.44.8'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: 26.1.5
flutter:
  plugin:
    platforms:
      android:
        package: com.dalicamera.dali_camera_platform
        pluginClass: DaliCameraPlatformPlugin
      ios:
        pluginClass: DaliCameraPlatformPlugin
